<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="trk-version" content="1.30">
<meta name="trk-mode" content="desktop">
<meta name="theme-color" content="#ffffff">
<title>Compliance</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* Basic look — same colours as CallDashboard / HCAD "Basic" (white background, simple buttons) */
:root{
  color-scheme:light;
  --bg:#ffffff; --card:#ffffff; --soft:#f6f7f9; --soft2:#f3f4f6; --line:#d8dde3; --field:#c4cad3;
  --accent:#1d3f72; --accent-dk:#163259; --pick:#0b5cad;
  --text:#1f2328; --gray:#5c6672;
  --ok:#167a3e; --warn:#8a5a00; --bad:#b42318; --info:#0b5cad; --na:#8a929c;
  --dot-ok:#2e9e57; --dot-warn:#e0a200; --dot-bad:#d93025; --dot-info:#1a73e8; --dot-na:#a7afba;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:#fff;border:1px solid var(--field);border-radius:6px;padding:10px;width:100%}
input::placeholder,textarea::placeholder{color:#8a929c}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
textarea{min-height:70px}
label{display:block;font-size:.8rem;font-weight:700;color:var(--text);margin:12px 0 4px}
[hidden]{display:none!important}
.btn{background:#fff;color:var(--text);border:1px solid var(--field);border-radius:6px;padding:10px 14px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(31,35,40,.32)}
.btn:hover:not(:disabled){filter:brightness(.97)}
.btn.gold{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.btn.gold:hover:not(:disabled){background:var(--accent-dk);filter:none}
.btn.red{background:#fff;color:var(--bad);border-color:#e3a6a0}
.btn.green{background:#fff;color:var(--ok);border-color:#9fd3b2}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--gray);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{margin:0 0 6px;font-size:1rem;color:var(--accent)}
h2{font-size:1.1rem;margin:18px 0 10px;color:var(--accent)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap;border:1px solid transparent}
.p-ok{background:#eaf6ee;color:var(--ok);border-color:#9fd3b2}
.p-warn{background:#fff4d6;color:var(--warn);border-color:#e2c27a}
.p-bad{background:#fdecea;color:var(--bad);border-color:#e3a6a0}
.p-info{background:#eaf2fb;color:var(--info);border-color:#a9c7ea}
.p-na{background:var(--soft2);color:var(--gray);border-color:var(--line)}

/* sign in — copied from CallDashboard's phone login (Basic look) */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.m-login-box{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px 32px 32px;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.m-login-logo{text-align:center;margin-bottom:22px}
.m-login-logo img{width:72px}
.m-login-title{text-align:center;font-family:'Oswald',sans-serif;font-size:1.25rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;color:var(--text)}
.m-login-title span{color:var(--accent)}
.m-login-sub{text-align:center;font-size:.72rem;color:var(--gray);letter-spacing:.1em;text-transform:uppercase;margin-bottom:28px}
.m-field{margin-bottom:16px}
.m-label{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);margin:0 0 6px;font-weight:400}
.m-unit-wrap{display:flex;align-items:center;background:var(--soft2);border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:border-color .2s}
.m-unit-wrap:focus-within{border-color:var(--accent)}
.m-unit-prefix{padding:12px 10px 12px 14px;font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;color:var(--accent);border-right:1px solid var(--line);background:rgba(29,63,114,.06);white-space:nowrap}
.m-unit-input{background:transparent;border:none;padding:12px 14px;color:var(--text);font-size:16px;outline:none;flex:1;border-radius:0}
.m-input{width:100%;background:var(--soft2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--text);font-size:16px;outline:none;transition:border-color .2s}
.m-input:focus{border-color:var(--accent)}
.m-pw-wrap{position:relative}
.m-pw-wrap .m-input{padding-right:44px}
.m-pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray);cursor:pointer;padding:4px;display:flex}
.m-signin-btn{width:100%;margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:600;padding:14px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.m-signin-btn:hover{background:var(--accent-dk)}
.m-signin-btn:disabled{opacity:.6;cursor:not-allowed}
.m-err{margin-top:14px;padding:10px 14px;background:#fdecea;border:1px solid #f2c4bf;border-radius:7px;font-size:.82rem;color:var(--bad);text-align:center;display:none}
.m-err.show{display:block}
.m-forgot{background:none;border:none;color:var(--gray);font-size:.78rem;cursor:pointer;text-decoration:underline}
.m-build{text-align:center;margin-top:18px;font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--accent);border:1px solid rgba(29,63,114,.4);border-radius:6px;padding:6px 12px;display:inline-block;position:relative;left:50%;transform:translateX(-50%)}

/* app shell */
/* top bar — like the CAD (logo, HATZOLAH MC, unit) */
#topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.tb-left img{width:40px;height:auto}
.tb-title{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:1.05rem;color:var(--text);white-space:nowrap}
.tb-title span{color:var(--accent)}
.tb-sub{font-size:.62rem;color:var(--gray);letter-spacing:.08em;text-transform:uppercase}
.tb-who{text-align:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:.8rem;color:var(--gray);letter-spacing:.04em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-right{display:flex;align-items:center;gap:6px}
#bell{position:relative;background:#fff;border:1px solid var(--field);color:var(--text);border-radius:6px;width:42px;height:38px;font-size:1.1rem;box-shadow:inset 0 0 0 1px rgba(31,35,40,.32)}
#bell .badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:999px;font-size:.7rem;font-weight:800;min-width:20px;height:20px;line-height:20px;padding:0 5px}
/* page header: ← Home + page name (CAD .inner-topbar / .m-subpage-header) */
#pagehead{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff}
.back-btn{background:#fff;border:1px solid var(--field);border-radius:6px;color:var(--accent);font-family:'Oswald',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(31,35,40,.32);flex-shrink:0}
.page-title{font-family:'Oswald',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
/* home tiles — CAD .big-btn / .m-tile in its Basic look */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:820px;margin:20px auto 8px}
.tile{position:relative;overflow:hidden;background:#fff;border:1px solid #dcc78f;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;padding:26px 14px 20px;text-align:center;font:inherit;color:var(--text);animation:fadeUp .5s ease both;aspect-ratio:1/.8;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s}
.tile::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--strip,var(--accent))}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.12)}
.tile:active{transform:scale(.98)}
.tile .ti{font-size:2.4rem;line-height:1;margin-bottom:12px}
.tile .tl{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;display:block;margin-bottom:4px}
.tile .ts{font-size:.72rem;color:var(--gray);letter-spacing:.03em;line-height:1.4}
.tile .tb{position:absolute;top:12px;right:12px;background:var(--bad);color:#fff;border-radius:999px;font-size:.72rem;font-weight:800;min-width:22px;height:22px;line-height:22px;padding:0 6px}
.tile .tb.w{background:#e0a200;color:#1f2328}
.tile[data-sec="profile"],.tile[data-sec="vehicles"]{--strip:#4a90d9}
.tile[data-sec="docs"]{--strip:#8b7cef}
.tile[data-sec="bag"]{--strip:#4caf80}
.tile[data-sec="rigs"]{--strip:#e0a200}
.tile[data-sec="admin"]{--strip:#1d3f72}
/* admin tabs — CAD .admin-tab (underlined) */
.admin-tabbar{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -16px 14px;padding:0 8px;background:#fff;scrollbar-width:thin}
.admin-tab{background:none;border:none;border-bottom:3px solid transparent;color:var(--gray);font-family:'Oswald',sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px 14px;cursor:pointer;white-space:nowrap}
.admin-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
/* phone version */
.trk-mobile #topbar{padding:calc(12px + env(safe-area-inset-top)) 12px 12px;gap:8px}
.trk-mobile .tb-left img{width:34px}
.trk-mobile .tb-title{font-size:.82rem}
.trk-mobile .tb-sub{display:none}
.trk-mobile .tb-who{font-size:.7rem}
.trk-mobile #pagehead{padding:12px 16px}
.trk-mobile .tiles{grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.trk-mobile .tile{aspect-ratio:auto;padding:18px 12px 14px}
.trk-mobile .tile .ti{font-size:2rem;margin-bottom:10px}
.trk-mobile .tile .tl{font-size:.88rem}
.trk-mobile .tile .ts{font-size:.65rem}
.trk-mobile .tile:hover{transform:none}
@media (max-width:640px){.trk-desktop .tiles{grid-template-columns:1fr 1fr}.trk-desktop .tile{aspect-ratio:auto}.trk-desktop .tb-who{display:none}}
.trk-mobile .tb-who{display:block}
#view{max-width:1100px;margin:0 auto;padding:12px 16px 80px}
#banner:empty{display:none}
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:10px;background:#fdecea;border:1px solid #e3a6a0;color:#7a1810}
.banner.warn{background:#fff4d6;border-color:#e2c27a;color:#5c3c00}
.banner b{display:block;margin-bottom:2px}

/* notification panel */
#panel-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;border-left:1px solid var(--line);z-index:41;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);box-shadow:-4px 0 16px rgba(0,0,0,.08)}
#panel header{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
#panel header b{flex:1;font-size:1.05rem;color:var(--accent)}
#panel-list{overflow-y:auto;padding:10px 12px}
.nitem{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:10px 12px;margin-bottom:8px;color:var(--text)}
.nitem:hover{background:var(--soft)}
.nitem.bad{border-left-color:var(--dot-bad)} .nitem.warn{border-left-color:var(--dot-warn)} .nitem.info{border-left-color:var(--dot-info)}
.nitem small{display:block;color:var(--gray)}

/* document cards */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.doc .top{display:flex;gap:8px;align-items:flex-start}
.doc .top h3{flex:1}
.kv{display:grid;grid-template-columns:110px 1fr;gap:2px 8px;font-size:.88rem;margin:8px 0}
.kv span:nth-child(odd){color:var(--gray)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.thumbs a{display:block;width:64px;height:64px;border-radius:6px;border:1px solid var(--line);overflow:hidden;background:var(--soft);color:var(--gray);font-size:.7rem;text-align:center;line-height:64px;text-decoration:none}
.thumbs img{width:100%;height:100%;object-fit:cover}
/* 1.21: a real preview of the document on its card (photo, or page 1 of a PDF) */
.thumbs a.big{width:100%;height:auto;line-height:normal;background:var(--soft);position:relative}
.thumbs a.big img{display:block;width:100%;height:170px;object-fit:contain}
.thumbs a.big .tag{position:absolute;left:6px;bottom:6px;background:rgba(31,35,40,.75);color:#fff;border-radius:4px;padding:1px 6px;font-size:.7rem}
.note{font-size:.85rem;background:#fdecea;border:1px solid #f2c4bf;color:#7a1810;border-radius:6px;padding:6px 8px;margin:6px 0}

/* pop-up */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal{background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;width:min(720px,100%);max-height:94vh;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.15)}
@media (min-width:760px){#modal-bg{align-items:center}#modal{border-radius:14px}}
#modal header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
#modal header b{flex:1;font-size:1.05rem;color:var(--accent)}
#modal .body{overflow-y:auto;padding:4px 16px 16px}
#modal footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--soft);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:none;color:var(--gray);font-size:1.4rem;padding:0 6px}
.x:hover{color:var(--bad)}

/* checklists */
.sec{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:8px;background:var(--soft2);padding:10px 12px}
.sec-h b{flex:1;color:var(--accent)}
.item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.item .nm{flex:1;font-size:.92rem}
.item .par{color:var(--gray);font-size:.78rem}
.tog{display:flex;gap:4px}
.tog button{width:46px;height:38px;border-radius:6px;border:1px solid var(--field);background:#fff;color:var(--gray);font-weight:800;box-shadow:inset 0 0 0 1px rgba(31,35,40,.32)}
.tog button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tog button.bad.on{background:var(--bad);border-color:var(--bad);color:#fff}
.tog.yn button{width:58px}
.up-prev{min-height:90px;border:1px dashed var(--field);border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
.up-prev img{max-width:100%;max-height:280px;transition:transform .2s}
.scan-box{margin-top:12px;padding:10px 12px;border:1px solid #a9c7ea;background:#eaf2fb;border-radius:8px;color:#0b3d75;font-size:.9rem}
input.scanned{background:#eaf2fb;border-color:#a9c7ea}
.up-bar{height:10px;border-radius:999px;background:var(--soft2);border:1px solid var(--line);overflow:hidden}
#up-bar-fill{height:100%;width:0;background:var(--accent);transition:width .2s}
.exp-tbl td.num{font-variant-numeric:tabular-nums}
.rigs-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr))}
.exp-tbl td,.exp-tbl th{white-space:normal}
.ck-q{background:var(--soft)}
.item-note{padding:0 12px 10px;border-top:none}
.item-note input{padding:8px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--soft2);position:sticky;top:0;font-size:.78rem;color:var(--gray)}
td.c{text-align:center}
tbody tr:hover{background:var(--soft)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;border:none;padding:0}
.d-ok{background:var(--dot-ok)} .d-warn{background:var(--dot-warn)} .d-bad{background:var(--dot-bad)} .d-info{background:var(--dot-info)} .d-na{background:var(--dot-na)} .d-missing{background:transparent;border:2px solid var(--dot-bad)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.subtabs button{background:#fff;border:1px solid var(--field);color:var(--text);border-radius:6px;padding:7px 12px;font-size:.85rem;font-weight:600;box-shadow:inset 0 0 0 1px rgba(31,35,40,.32)}
.subtabs button.on{background:var(--pick);border-color:var(--pick);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--gray);margin:8px 0}
.legend span{display:flex;align-items:center;gap:5px}

td.rep-bad{color:var(--bad);font-weight:700}
td.rep-warn{color:var(--warn);font-weight:700}
@media print{
  body.printing-report > *:not(#app){display:none!important}
  body.printing-report #topbar,body.printing-report #pagehead,body.printing-report #banner,body.printing-report .admin-tabbar{display:none!important}
  body.printing-report #view > *:not(#rep-out){display:none!important}
  body.printing-report .report button{display:none!important}
  body.printing-report .tbl-wrap{overflow:visible;border:none}
  body.printing-report th{position:static}
  body.printing-report td,body.printing-report th{font-size:9pt;white-space:normal}
}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2328;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.big-num{font-size:1.8rem;font-weight:800;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
/* home tiles: like the CAD's home tiles — 16px corners, gold edge, one soft shadow */
.stats .card{margin:0;text-align:left;cursor:pointer;color:var(--text);font:inherit;border:1px solid #dcc78f;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stats .card:hover{background:var(--soft)}
.empty{color:var(--gray);text-align:center;padding:24px}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 14px}
.pf-f{min-width:0}
.pf-ro{padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--soft);min-height:44px;overflow-wrap:anywhere}
.dtype{display:grid;grid-template-columns:1fr 130px 110px auto auto auto auto;gap:6px;align-items:center;margin-bottom:6px}
.dtype label{margin:0;display:flex;gap:4px;align-items:center;font-weight:400;color:var(--text);font-size:.8rem}
.dtype input[type=checkbox]{width:auto}
@media (max-width:700px){.dtype{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<!-- ═══════════ SIGN IN (same as CallDashboard's login) ═══════════ -->
<div id="login" hidden>
  <div class="m-login-box">
    <div class="m-login-logo">
      <img id="li-logo" src="https://i.ibb.co/j40wTVT/hatzolah-middelessex-county-final-removebg-preview-1-20231129-233435-0000.png" alt="Logo">
    </div>
    <div class="m-login-title" id="li-title">Hatzolah <span>MC</span></div>
    <div class="m-login-sub">Compliance Tracker — Authorized Personnel Only</div>

    <div class="m-field">
      <label class="m-label" for="li-unit">Unit Number</label>
      <div class="m-unit-wrap">
        <span class="m-unit-prefix" id="li-prefix">MC-</span>
        <input class="m-unit-input" id="li-unit" type="text" inputmode="numeric" placeholder="Enter Unit ID" maxlength="4" autocomplete="off"
          oninput="this.value=this.value.replace(/[^0-9]/g,'')">
      </div>
    </div>

    <div class="m-field">
      <label class="m-label" for="li-pw">Password</label>

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function toast(msg, ms){ var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, ms || 3200); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function todayStr(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function daysUntil(ymd){
  if (!ymd) return null;
  var p = ymd.split("-"); var d = new Date(+p[0], +p[1]-1, +p[2]);
  var t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
function fmtDate(ymd){ if (!ymd) return ""; var p = ymd.split("-"); return p[1] + "/" + p[2] + "/" + p[0]; }
function fmtTs(ms){
  if (!ms) return "Never";
  var d = new Date(ms);
  return pad(d.getMonth()+1) + "/" + pad(d.getDate()) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
// The same footer every CallDashboard text ends with: "Date: MM/DD/YYYY  Time: HH:MM" (New Jersey time)
function smsStamp(){
  var parts = {};
  new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).forEach(function(p){ parts[p.type] = p.value; });
  return "Date: " + parts.month + "/" + parts.day + "/" + parts.year + "  Time: " + parts.hour + ":" + parts.minute;
}
function normUnit(u){
  u = String(u || "").trim().toUpperCase().replace(/\s+/g, "");
  var pre = TRK_CONFIG.unitPrefix.toUpperCase();
  var bare = pre.replace(/-$/, "");
  if (/^\d+$/.test(u)) return pre + u;   // same as the CAD: "5" → MC-5, "02" → MC-02
  if (u.indexOf(bare) === 0 && u.indexOf(pre) !== 0) u = pre + u.slice(bare.length).replace(/^-/, "");
  return u;
}
function unitNum(u){ var m = String(u || "").match(/(\d+)/); return m ? +m[1] : 9999; }
function daysAgo(ms){ return ms ? Math.floor((Date.now() - ms) / 86400000) : null; }
function orgName(){ return S.org.textName || S.org.shortName || "MC Hatzolah"; }
function pageLink(){ return location.origin + location.pathname; }
function docTypes(scope){ return (S.settings.docTypes || []).filter(function(t){ return !scope || t.scope === scope; }); }
function typeById(id){ return (S.settings.docTypes || []).filter(function(t){ return t.id === id; })[0]; }
function userByUid(uid){ return S.users.filter(function(u){ return u.uid === uid; })[0]; }
function withName(u){ if (u && !u.name) u.name = ((u.firstName || "") + " " + (u.lastName || "")).trim(); return u; }
function rolesOf(u){ var r = (u && u.roles) || []; if (u && u.role && r.indexOf(u.role) < 0) r = r.concat([u.role]); return r; }

// Record key: member docs  "<uid>__<type>"   personal vehicle "v_<vehicleDocId>__<type>"   rig "org_<vehicleId>__<type>"
function recKey(owner, type){ return owner + "__" + type; }

function recStatus(rec, type){
  if (!rec) return type && type.required === false ? { k: "na", lbl: "Optional — not uploaded", lvl: "na" } : { k: "missing", lbl: "Missing", lvl: "bad" };
  if (rec.status === "na") return { k: "na", lbl: "Not required", lvl: "na" };
  if (rec.status === "rejected") return { k: "rejected", lbl: "Needs a new copy", lvl: "bad" };
  if (type && type.expires && rec.expires){
    var d = daysUntil(rec.expires);
    if (d < 0) return { k: "expired", lbl: "Expired", lvl: "bad", days: d };
    if (d <= (S.settings.warnDays || 30)) return { k: "expiring", lbl: "Expires in " + d + " day" + (d === 1 ? "" : "s"), lvl: "warn", days: d };
  }
  if (rec.status === "pending") return { k: "pending", lbl: "Waiting for review", lvl: "info" };
  return { k: "ok", lbl: "Valid", lvl: "ok" };
}
function pillFor(st){ return '<span class="pill p-' + st.lvl + '">' + esc(st.lbl) + '</span>'; }
function dotFor(st, title){ var cls = st.k === "missing" ? "d-missing" : "d-" + st.lvl; return '<span class="dot ' + cls + '" title="' + esc(title || st.lbl) + '"></span>'; }

function fmtDash(ymd){ if (!ymd) return ""; var p = ymd.split("-"); return p[1] + "-" + p[2] + "-" + p[0]; }
function expState(ymd){
  if (!ymd) return { k: "missing", lbl: "No date", lvl: "bad" };
  var d = daysUntil(ymd);
  if (d < 0) return { k: "expired", lbl: "Expired " + (-d) + " day" + (d === -1 ? "" : "s") + " ago", lvl: "bad" };
  if (d <= (S.settings.warnDays || 30)) return { k: "expiring", lbl: d === 0 ? "Expires today" : "Expires in " + d + " day" + (d === 1 ? "" : "s"), lvl: "warn" };
  return { k: "ok", lbl: "In Date", lvl: "ok" };
}

function bagExpFor(uid){ return uid === (S.me && S.me.uid) ? (S.myBagExp || {}) : (S.allBagExp[uid] || {}); }
// 1.27: bags an admin gives a member — settings.bagAssign[uid] = { extra: [{id, name}] (more personal bags), fleet: [Fleet bag ids] (bags they look after)
function bagAssignOf(uid){ var a = ((S.settings || {}).bagAssign || {})[uid] || {}; return { extra: (a.extra || []).filter(function(x){ return x && x.id && x.name; }), fleet: (a.fleet || []).filter(Boolean) }; }
function personalBagStatus(uid, bid){ var d = uid === (S.me && S.me.uid) ? S.myBag : S.allBags[uid]; return bid ? ((d && d.bags && d.bags[bid]) || null) : d; }
function personalBagName(uid, bid){ if (!bid) return "Primary Bag"; var x = bagAssignOf(uid).extra.filter(function(e){ return e.id === bid; })[0]; return x ? x.name : "Bag"; }
function bagDatesOf(uid, bid){ var e = bagExpFor(uid); return bid ? ((e.bagDates || {})[bid] || null) : (e.updatedAt ? (e.dates || {}) : null); }
function bagDatesMeta(uid, bid){ var e = bagExpFor(uid); return bid ? ((e.bagDatesMeta || {})[bid] || {}) : { at: e.updatedAt, by: e.updatedBy }; }
function fleetBagById(id){ return S.fleet.filter(function(v){ return v.id === id; })[0]; }
// [{item, date, st}] for every item on the admin's list
function bagExpRows(uid, bid){
  var dates = bagDatesOf(uid, bid) || {};
  return (S.settings.expItems || []).map(function(n){ return { item: n, date: dates[n] || "", st: expState(dates[n]) }; });
}
function bagRequired(u){
  var need = S.settings.bagRoles || [];
  return rolesOf(u).some(function(r){ return need.indexOf(r) >= 0; }) || (u && u.role === "admin" && need.indexOf("admin") >= 0);
}
function bagState(bag){
  var iv = S.settings.bagIntervalDays || 30;
  if (!bag || !bag.lastAt) return { k: "due", lbl: "Never checked", lvl: "bad", dueIn: -1 };
  var dueIn = iv - daysAgo(bag.lastAt);
  if (dueIn < 0) return { k: "overdue", lbl: "Overdue by " + (-dueIn) + " day" + (dueIn === -1 ? "" : "s"), lvl: "bad", dueIn: dueIn };
  if (dueIn === 0) return { k: "due", lbl: "Due today", lvl: "bad", dueIn: 0 };
  if (bag.missing && bag.missing.length) return { k: "missing", lbl: bag.missing.length + " item" + (bag.missing.length === 1 ? "" : "s") + " missing", lvl: "warn", dueIn: dueIn };
  if (dueIn <= 3) return { k: "soon", lbl: "Due in " + dueIn + " day" + (dueIn === 1 ? "" : "s"), lvl: "warn", dueIn: dueIn };
  return { k: "ok", lbl: "Checked " + fmtTs(bag.lastAt).split(" ")[0], lvl: "ok", dueIn: dueIn };
}
function rigState(rs){
  var iv = S.settings.rigIntervalDays || 7;
  if (!rs || !rs.lastAt) return { k: "due", lbl: "Never checked", lvl: "bad" };
  var dueIn = iv - daysAgo(rs.lastAt);
  if (rs.problems && rs.problems.length) return { k: "problems", lbl: rs.problems.length + " problem" + (rs.problems.length === 1 ? "" : "s"), lvl: "bad", dueIn: dueIn };
  if (dueIn <= 0) return { k: "due", lbl: dueIn === 0 ? "Check due today" : "Overdue by " + (-dueIn) + " day" + (dueIn === -1 ? "" : "s"), lvl: "bad", dueIn: dueIn };
  if (dueIn <= 1) return { k: "soon", lbl: "Due tomorrow", lvl: "warn", dueIn: dueIn };
  return { k: "ok", lbl: "Checked " + fmtTs(rs.lastAt).split(" ")[0], lvl: "ok", dueIn: dueIn };
}

// Everything a member must fix: their own documents, their vehicles' documents, their jump bag.
function memberIssues(u, records, vehicles, bag){
  var out = [];
  docTypes("member").forEach(function(t){
    var st = recStatus(records[recKey(u.uid, t.id)], t);
    if (st.lvl === "bad" || st.lvl === "warn"){
      var rec = records[recKey(u.uid, t.id)];
      var txt = t.name + ": " + (st.k === "expired" ? "expired " + fmtDate(rec.expires) : st.k === "expiring" ? "expires " + fmtDate(rec.expires) : st.k === "missing" ? "not on file" : st.lbl.toLowerCase());
      out.push({ lvl: st.lvl, text: txt, tab: "docs" });
    }
  });
  vehicles.forEach(function(v){
    docTypes("vehicle").forEach(function(t){
      var key = recKey("v_" + v.id, t.id), st = recStatus(records[key], t);
      if (st.lvl === "bad" || st.lvl === "warn"){
        var rec = records[key];
        var txt = (v.name || "Vehicle") + " — " + t.name + ": " + (st.k === "expired" ? "expired " + fmtDate(rec.expires) : st.k === "expiring" ? "expires " + fmtDate(rec.expires) : st.k === "missing" ? "not on file" : st.lbl.toLowerCase());
        out.push({ lvl: st.lvl, text: txt, tab: "vehicles" });
      }
    });
  });
  // (1.28: agency vehicle paperwork is admins only — ⚙ Admin ▸ Agency Paperwork; logistics aren't reminded about it any more)
  if (bagRequired(u)){
    var bs = bagState(bag);
    if (bs.lvl === "bad") out.push({ lvl: "bad", text: "Jump bag check: " + bs.lbl.toLowerCase(), tab: "bag" });
    else if (bs.k === "soon") out.push({ lvl: "warn", text: "Jump bag check: " + bs.lbl.toLowerCase(), tab: "bag" });
    else if (bs.k === "missing") out.push({ lvl: "warn", text: "Jump bag: " + bs.lbl, tab: "bag" });
    var exp = bagExpFor(u.uid);
    if (exp.updatedAt) bagExpRows(u.uid).forEach(function(r){
      if (r.st.k === "expired") out.push({ lvl: "bad", text: "Jump bag — " + r.item + ": expired " + fmtDate(r.date), tab: "bag" });
      else if (r.st.k === "expiring") out.push({ lvl: "warn", text: "Jump bag — " + r.item + ": expires " + fmtDate(r.date), tab: "bag" });
    });
    else if ((S.settings.expItems || []).length) out.push({ lvl: "warn", text: "Jump bag: expiration dates not entered yet", tab: "bag" });
  }
  var asg = bagAssignOf(u.uid);
  asg.extra.forEach(function(x){
    var bs2 = bagState(personalBagStatus(u.uid, x.id)), nm = x.name;
    if (bs2.lvl === "bad") out.push({ lvl: "bad", text: nm + " check: " + bs2.lbl.toLowerCase(), tab: "bag" });
    else if (bs2.k === "soon") out.push({ lvl: "warn", text: nm + " check: " + bs2.lbl.toLowerCase(), tab: "bag" });
    else if (bs2.k === "missing") out.push({ lvl: "warn", text: nm + ": " + bs2.lbl, tab: "bag" });
    if (bagDatesOf(u.uid, x.id)) bagExpRows(u.uid, x.id).forEach(function(r){
      if (r.st.k === "expired") out.push({ lvl: "bad", text: nm + " — " + r.item + ": expired " + fmtDate(r.date), tab: "bag" });
      else if (r.st.k === "expiring") out.push({ lvl: "warn", text: nm + " — " + r.item + ": expires " + fmtDate(r.date), tab: "bag" });
    });
    else if ((S.settings.expItems || []).length) out.push({ lvl: "warn", text: nm + ": expiration dates not entered yet", tab: "bag" });
  });
  asg.fleet.forEach(function(fid){
    var fv = fleetBagById(fid); if (!fv) return;
    var nm = bagLabel(fv), bs3 = bagState(S.allBags["org_" + fid]);
    if (bs3.lvl === "bad") out.push({ lvl: "bad", text: nm + " check: " + bs3.lbl.toLowerCase(), tab: "bag" });
    else if (bs3.k === "soon") out.push({ lvl: "warn", text: nm + " check: " + bs3.lbl.toLowerCase(), tab: "bag" });
    else if (bs3.k === "missing") out.push({ lvl: "warn", text: nm + ": " + bs3.lbl, tab: "bag" });
    obExpRows(fid).forEach(function(r){
      if (r.st.k === "expired") out.push({ lvl: "bad", text: nm + " — " + r.item + ": expired " + fmtDate(r.date), tab: "bag" });
      else if (r.st.k === "expiring") out.push({ lvl: "warn", text: nm + " — " + r.item + ": expires " + fmtDate(r.date), tab: "bag" });
    });
  });
  return out;
}

/* ════════════════════════════════════════════════════════════════════════
   SIGN IN / OUT
   ════════════════════════════════════════════════════════════════════════ */
function loginErr(msg){ var e = $("login-err"); e.textContent = msg || ""; e.classList.toggle("show", !!msg); }
async function signIn(){
  var digits = ($("li-unit").value || "").trim(), pw = $("li-pw").value;
  loginErr("");
  if (!digits || !pw){ loginErr("Enter unit number and password."); return; }
  var unit = normUnit(digits);
  var btn = $("li-btn"); btn.disabled = true; btn.textContent = "Signing in...";
  try {
    var snap = await db.collection("unitLookup").doc(unit).get();
    if (!snap.exists) throw { msg: "Unit not found. Check your unit number." };
    var email = snap.data().email;
    if (!email) throw { msg: "No email on file for this unit." };
    await auth.signInWithEmailAndPassword(email, pw);
  } catch (e){
    var c = e && e.code;
    loginErr(e && e.msg ? e.msg
      : (c === "auth/wrong-password" || c === "auth/invalid-credential" || c === "auth/invalid-login-credentials") ? "Wrong password. Use your CallDashboard password."

  }

}

function stopListeners(){ S.unsubs.forEach(function(f){ try { f(); } catch (e){} }); S.unsubs = []; S.fbl = {}; }
// a member (not admin / logistics) follows the status of the Fleet bags an admin gave them (needs the 1.27 rules)
function syncFleetBagListeners(){
  if (!S.me || S.isAdmin || S.isLogistics) return;
  S.fbl = S.fbl || {};
  bagAssignOf(S.me.uid).fleet.forEach(function(fid){
    if (S.fbl[fid]) return; S.fbl[fid] = 1;
    listen(db.collection("trk_bagStatus").doc("org_" + fid), function(d){ if (d.exists) S.allBags["org_" + fid] = d.data(); else delete S.allBags["org_" + fid]; renderSoon(); });
  });
}
function listen(ref, fn){
  S.unsubs.push(ref.onSnapshot(fn, function(err){ console.warn("listener", err); if (err.code === "permission-denied") toast("Some data couldn't load (permission). Have the tracker rules been published?", 6000); }));
}
var renderSoon = (function(){ var t; return function(){ clearTimeout(t); t = setTimeout(render, 60); }; })();

function startListeners(){
  var uid = S.user.uid;
  listen(db.collection("trk_settings").doc("main"), function(d){
    var s = clone(DEFAULT_SETTINGS);
    if (d.exists){ var x = d.data(); Object.keys(x).forEach(function(k){ s[k] = x[k]; }); s.templates = Object.assign({}, DEFAULT_SETTINGS.templates, x.templates || {}); }
    S.settings = s; syncFleetBagListeners(); renderSoon();
  });
  listen(db.collection("appdata").doc("restockList"), function(d){ S.restock = d.exists ? d.data() : null; renderSoon(); });
  db.collection("appdata").doc("org").get().then(function(d){ if (d.exists) S.org = d.data(); }).catch(function(){});

  listen(db.collection("trk_records").where("uid", "==", uid), function(q){
    S.myRecords = {}; q.forEach(function(d){ S.myRecords[d.id] = Object.assign({ id: d.id }, d.data()); }); renderSoon();
  });
  listen(db.collection("trk_myVehicles").where("uid", "==", uid), function(q){
    S.myVehicles = []; S.myOldVehicles = [];
    q.forEach(function(d){ var v = Object.assign({ id: d.id }, d.data()); (v.replacedAt ? S.myOldVehicles : S.myVehicles).push(v); });
    S.myVehicles.sort(function(a, b){ return (a.slot || 9) - (b.slot || 9); });
    S.myVehicles.sort(function(a, b){ return (a.createdAt || 0) - (b.createdAt || 0); });
    // vehicle documents are keyed by the vehicle, not the member, so listen to those too
    listenMyVehicleRecords(); renderSoon();
  });
  listen(db.collection("trk_bagStatus").doc(uid), function(d){ S.myBag = d.exists ? d.data() : null; renderSoon(); });
  listen(db.collection("trk_bagExp").doc(uid), function(d){ S.myBagExp = d.exists ? d.data() : {}; renderSoon(); });
  listen(db.collection("trk_profiles").doc(uid), function(d){ S.myProfile = d.exists ? d.data() : {}; renderSoon(); });

  // everyone reads the fleet (CAD vehicles, read only): rigs, and the agency jump bags / cabinets that members check
  listen(db.collection("vehicles"), function(q){
    S.fleet = []; q.forEach(function(d){ S.fleet.push(Object.assign({ id: d.id }, d.data())); }); renderSoon();
  });
  if (S.isAdmin || S.isLogistics){
    listen(db.collection("trk_rigStatus"), function(q){ S.rigStatus = {}; q.forEach(function(d){ S.rigStatus[d.id] = d.data(); }); renderSoon(); });
    listen(db.collection("trk_bagStatus"), function(q){ S.allBags = {}; q.forEach(function(d){ S.allBags[d.id] = d.data(); }); renderSoon(); });
    listen(db.collection("trk_bagExp"), function(q){ S.allBagExp = {}; q.forEach(function(d){ S.allBagExp[d.id] = d.data(); }); renderSoon(); });
  }
  if (S.isAdmin){
    listen(db.collection("users"), function(q){
      S.users = []; q.forEach(function(d){ var u = d.data(); if (u && u.unit) S.users.push(withName(Object.assign({ uid: d.id }, u))); });
      S.users.sort(function(a, b){ return unitNum(a.unit) - unitNum(b.unit); }); renderSoon();
    });
    listen(db.collection("trk_records"), function(q){ S.allRecords = {}; q.forEach(function(d){ S.allRecords[d.id] = Object.assign({ id: d.id }, d.data()); }); renderSoon(); });
    listen(db.collection("trk_myVehicles"), function(q){
      S.allVehicles = []; S.allOldVehicles = [];
      q.forEach(function(d){ var v = Object.assign({ id: d.id }, d.data()); (v.replacedAt ? S.allOldVehicles : S.allVehicles).push(v); });
      renderSoon();
    });
    listen(db.collection("trk_profiles"), function(q){ S.profiles = {}; q.forEach(function(d){ S.profiles[d.id] = d.data(); }); renderSoon(); });
    listen(db.collection("trk_reminderLog"), function(q){ S.reminderLog = {}; q.forEach(function(d){ S.reminderLog[d.id] = d.data(); }); renderSoon(); });
  } else if (S.isLogistics){
    listen(db.collection("trk_records").where("uid", "==", "org"), function(q){
      Object.keys(S.allRecords).forEach(function(k){ if (S.allRecords[k].uid === "org") delete S.allRecords[k]; });
      q.forEach(function(d){ S.allRecords[d.id] = Object.assign({ id: d.id }, d.data()); }); renderSoon();
    });
  }
}

/* ════════════════════════════════════════════════════════════════════════
   FLEET (rigs come from CallDashboard's vehicles collection)
   ════════════════════════════════════════════════════════════════════════ */
function isEquipment(v){
  var t = String(v.type || "").toLowerCase(), id = String(v.id || "").toLowerCase(), nm = String(v.name || "").toLowerCase();
  return ["jumpbag", "storage", "other"].indexOf(t) >= 0 || /bag|jump bag|kit/.test(id) || /jump bag/.test(nm);
}
function isAmbulance(v){
  var t = String(v.type || v.kind || "").toLowerCase();
  if (/ambulance|rig/.test(t)) return true;
  if (/erv|car|suv/.test(t)) return false;
  return /9\d\d/.test(String(v.id) + " " + String(v.name || ""));
}
function rigList(){
  var ids = S.settings.rigIds;
  return S.fleet.filter(function(v){ return !isEquipment(v) && (ids ? ids.indexOf(v.id) >= 0 : isAmbulance(v)); })
    .sort(function(a, b){ return String(a.name || a.id).localeCompare(String(b.name || b.id), undefined, { numeric: true }); });
}
function orgVehicles(){ return S.fleet.filter(function(v){ return !isEquipment(v); }).sort(function(a, b){ return String(a.name || a.id).localeCompare(String(b.name || b.id), undefined, { numeric: true }); }); }
function vName(v){ return v.name || v.label || v.id; }

function jumpbagList(){
  var r = S.restock, list = (r && r.jumpbag && r.jumpbag.length) ? r.jumpbag : DEFAULT_JUMPBAG;
  var order = ["aed", "jump bag", "jump bag meds", "glucometer"];
  return list.slice().sort(function(a, b){ var x = order.indexOf(String(a.name).toLowerCase()), y = order.indexOf(String(b.name).toLowerCase()); return (x < 0 ? 99 : x) - (y < 0 ? 99 : y); });
}
function bagQuestions(section){
  var q = S.settings.bagQuestions || DEFAULT_BAG_QUESTIONS, key = Object.keys(q).filter(function(k){ return k.toLowerCase() === String(section).toLowerCase(); })[0];
  return key ? q[key] : [];
}
// Agency bags and cabinets members can check (CAD Fleet equipment). ⚙ Admin ▸ Timing & Equipment picks which.
// 1.25: only jump bags (Fleet type "Jump Bag", or "bag" in its name) — never storage rooms / cabinets
function isBagEquip(v){
  var t = String(v.type || "").toLowerCase();
  if (t === "storage") return false;
  return t === "jumpbag" || /\bbag\b|jump ?bag/i.test(String(v.id) + " " + String(v.name || "") + " " + String(v.description || ""));
}
function agencyBags(){
  var ids = S.settings.bagIds;
  return S.fleet.filter(function(v){ return isBagEquip(v) && (!ids || ids.indexOf(v.id) >= 0); })
    .sort(function(a, b){ return String(a.id).localeCompare(String(b.id), undefined, { numeric: true }); });
}
// The vehicle a bag belongs to: the Fleet's own link if there is one, otherwise the vehicle whose ID is in the bag's name ("MC-902 Jump Bag" → MC-902)
function bagVehicle(b){
  var vs = S.fleet.filter(function(v){ return !isEquipment(v); });
  var key = String(b.assignedTo || b.vehicleId || b.vehicle || b.rig || "").trim();
  if (key){ var m = vs.filter(function(v){ return v.id === key; })[0]; if (m) return m; }
  var hay = (String(b.id) + " " + String(b.name || "") + " " + String(b.description || "")).toUpperCase(), best = null;
  vs.forEach(function(v){
    var id = String(v.id).toUpperCase(), re = new RegExp("(^|[^A-Z0-9])" + id.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^A-Z0-9]|$)");
    if (re.test(hay) && (!best || id.length > String(best.id).length)) best = v;
  });
  return best;
}
function bagLabel(v){
  var n = vName(v) || String(v.id), veh = bagVehicle(v);
  if (veh && n.toUpperCase().indexOf(String(veh.id).toUpperCase()) === -1) n = vName(veh) + " " + n;
  return n;
}
// [{ veh, bags }] — each vehicle's bags together; bags without a vehicle last
function bagsByVehicle(standalone){
  var groups = [], byId = {}, rigIds = standalone ? rigList().map(function(v){ return v.id; }) : [];
  agencyBags().forEach(function(b){
    var veh = bagVehicle(b), k = veh ? veh.id : "";
    if (standalone && veh && rigIds.indexOf(veh.id) >= 0) return;   // checked with its rig (1.26)
    if (!byId[k]){ byId[k] = { veh: veh, bags: [] }; groups.push(byId[k]); }
    byId[k].bags.push(b);
  });
  return groups.sort(function(a, b){ return !a.veh ? 1 : !b.veh ? -1 : String(vName(a.veh)).localeCompare(String(vName(b.veh)), undefined, { numeric: true }); });
}
function bagsOfVehicle(vid){ return agencyBags().filter(function(b){ var v = bagVehicle(b); return v && v.id === vid; }); }
function rigSupplyList(){ var r = S.restock; return (r && r.sections && r.sections.length) ? r.sections : DEFAULT_RIG_SUPPLIES; }

/* ════════════════════════════════════════════════════════════════════════
   NOTIFICATIONS (bell panel + banner)
   ════════════════════════════════════════════════════════════════════════ */
function notifications(){
  var list = [];
  var mine = memberIssues(S.me, S.myRecords, S.myVehicles, S.myBag);
  mine.forEach(function(i){ list.push({ lvl: i.lvl, title: i.text, sub: "Tap to fix", tab: i.tab }); });

  if (S.isAdmin){
    var pend = Object.values(S.allRecords).filter(function(r){ return r.status === "pending"; });
    if (pend.length) list.push({ lvl: "info", title: pend.length + " upload" + (pend.length === 1 ? "" : "s") + " waiting for review", sub: "Admin ▸ Review", tab: "admin", admin: "review" });
    var bad = 0, warn = 0;
    S.users.forEach(function(u){
      var iss = memberIssues(u, S.allRecords, S.allVehicles.filter(function(v){ return v.uid === u.uid; }), S.allBags[u.uid]);
      if (iss.some(function(i){ return i.lvl === "bad"; })) bad++; else if (iss.length) warn++;
    });
    if (bad) list.push({ lvl: "bad", title: bad + " member" + (bad === 1 ? " has" : "s have") + " expired, missing or overdue items", sub: "Admin ▸ Compliance", tab: "admin", admin: "grid" });
    if (warn) list.push({ lvl: "warn", title: warn + " member" + (warn === 1 ? " has" : "s have") + " items expiring soon", sub: "Admin ▸ Compliance", tab: "admin", admin: "grid" });
  }
  if (S.isAdmin || S.isLogistics){
    rigList().forEach(function(v){
      var st = rigState(S.rigStatus[v.id]);
      if (st.lvl !== "ok") list.push({ lvl: st.lvl, title: vName(v) + ": " + st.lbl, sub: "Vehicle Checks", tab: "rigs" });
      var es = rigExpSummary(v.id);
      if (es.expired) list.push({ lvl: "bad", title: vName(v) + ": " + es.expired + " item" + (es.expired === 1 ? "" : "s") + " on the rig expired", sub: "Vehicle Checks ▸ Expiration dates", tab: "rigs" });
      if (es.expiring) list.push({ lvl: "warn", title: vName(v) + ": " + es.expiring + " item" + (es.expiring === 1 ? "" : "s") + " on the rig expiring soon", sub: "Vehicle Checks ▸ Expiration dates", tab: "rigs" });
    });
    if (S.isAdmin) orgVehicles().forEach(function(v){
      docTypes("vehicle").forEach(function(t){
        var st = recStatus(S.allRecords[recKey("org_" + v.id, t.id)], t);
        if (st.lvl === "bad" || st.lvl === "warn") list.push({ lvl: st.lvl, title: vName(v) + " — " + t.name + ": " + st.lbl.toLowerCase(), sub: "⚙ Admin ▸ Agency Paperwork", tab: "admin", admin: "paper" });
      });
    });
    agencyBags().forEach(function(v){
      var es = obExpSummary(v.id);
      if (es.expired) list.push({ lvl: "bad", title: bagLabel(v) + ": " + es.expired + " item" + (es.expired === 1 ? "" : "s") + " expired", sub: "Jump Bags ▸ Agency bags", tab: S.isAdmin ? "admin" : "bag", admin: "bags" });
      if (es.expiring) list.push({ lvl: "warn", title: bagLabel(v) + ": " + es.expiring + " item" + (es.expiring === 1 ? "" : "s") + " expiring soon", sub: "Jump Bags ▸ Agency bags", tab: S.isAdmin ? "admin" : "bag", admin: "bags" });
    });
    var bagMiss = Object.values(S.allBags).filter(function(b){ return b.missing && b.missing.length; });
    if (bagMiss.length) list.push({ lvl: "warn", title: bagMiss.length + " jump bag" + (bagMiss.length === 1 ? " is" : "s are") + " missing items", sub: bagMiss.map(function(b){ return b.unit; }).join(", "), tab: S.isAdmin ? "admin" : "rigs", admin: "bags" });
  }
  var order = { bad: 0, warn: 1, info: 2 };
  return list.sort(function(a, b){ return order[a.lvl] - order[b.lvl]; });
}
function renderBell(){
  var n = notifications(), count = n.filter(function(x){ return x.lvl !== "info" || S.isAdmin; }).length;
  var b = $("bell-n"); b.hidden = !count; b.textContent = count > 99 ? "99+" : count;
  var ab = $("adm-btn"); if (ab && S.isAdmin){ var pend = Object.values(S.allRecords).filter(function(r){ return r.status === "pending"; }).length; ab.textContent = "⚙ Admin" + (pend ? " · " + pend + " to approve" : ""); ab.classList.toggle("gold", !!pend); }
  if (!$("panel").hidden) renderPanel(n);
  // banner: only the member's own urgent items
  var mine = memberIssues(S.me, S.myRecords, S.myVehicles, S.myBag);
  var urgent = mine.filter(function(i){ return i.lvl === "bad"; });
  var soon = mine.filter(function(i){ return i.lvl === "warn"; });
  $("banner").innerHTML = urgent.length
    ? '<div class="banner"><b>⚠ ' + urgent.length + ' item' + (urgent.length === 1 ? " needs" : "s need") + ' your attention</b>' + urgent.map(function(i){ return esc(i.text); }).join("<br>") + '</div>'
    : soon.length ? '<div class="banner warn"><b>Coming up soon</b>' + soon.map(function(i){ return esc(i.text); }).join("<br>") + '</div>' : "";
}
function renderPanel(n){

    return '<button class="nitem ' + x.lvl + '" onclick="App.goNotif(' + i + ')"><div>' + (x.lvl === "bad" ? "🔴" : x.lvl === "warn" ? "🟡" : "🔵") + '</div><div>' + esc(x.title) + '<small>' + esc(x.sub || "") + '</small></div></button>';
  }).join("") : '<div class="empty">✅ You\'re all caught up.</div>';
  S._notifs = n;
}

function closePanel(){ $("panel").hidden = true; $("panel-bg").hidden = true; }
function goNotif(i){ var x = S._notifs[i]; closePanel(); if (!x) return; if (x.admin) S.adminTab = x.admin; setTab(x.tab === "admin" && TRK_MODE !== "desktop" ? "home" : x.tab); }

var PAGES = {
  profile:  { icon: "👤", label: "My Profile",   sub: "Addresses, phones, emergency contact, uniform" },
  docs:     { icon: "📄", label: "My Documents", sub: "License, EMT, CPR, permits, CEVO" },

  rigs:     { icon: "🚑", label: "Vehicle Checks", sub: "Ambulance & ambulance jump bag checks" },
  admin:    { icon: "⚙", label: "Admin", sub: "Compliance, review, reports, checklists, settings" }
};
function tabsList(){
  var t = ["profile", "docs", "vehicles", "bag"];
  if (S.isAdmin || S.isLogistics) t.push("rigs");
  if (S.isAdmin && TRK_MODE === "desktop") t.push("admin");   // opened from the ⚙ Admin button in the top bar (1.25), not a tile   // like the CAD, admin is on the computer
  return t;
}
function setTab(t, fromHistory){
  if (t === "panel"){ t = "admin"; if (ADMIN_SETTINGS_TABS.indexOf(S.adminTab) < 0) S.adminTab = "rigcl"; }
  if (t === "admin" && TRK_MODE !== "desktop") t = "home";
  if (t !== "home" && tabsList().indexOf(t) < 0) t = "home";
  var changed = S.tab !== t;
  S.tab = t;
  // phone Back key: a page opened from home gets a history entry, so Back returns home (like CAD 5.21)
  if (!fromHistory && changed){ try { if (t === "home"){ if (history.state && history.state.trk && history.state.trk !== "home") history.back(); } else history.pushState({ trk: t }, ""); } catch (e){} }
  render(); window.scrollTo(0, 0);
}
function goHome(){ setTab("home"); }
window.addEventListener("popstate", function(e){
  if (!S.me) return;
  if (!$("modal-bg").hidden && !S.check){ closeModal(); try { history.pushState({ trk: S.tab }, ""); } catch (er){} return; }
  if (!$("panel").hidden){ closePanel(); try { history.pushState({ trk: S.tab }, ""); } catch (er){} return; }
  setTab((e.state && e.state.trk) || "home", true);
});
// red / amber count on each tile = what needs doing there
function tileCounts(){
  var c = {};
  notifications().forEach(function(n){
    var k = n.tab; if (!PAGES[k]) return;
    c[k] = c[k] || { bad: 0, warn: 0 }; if (n.lvl === "warn") c[k].warn++; else c[k].bad++;
  });
  return c;
}
function render(){
  if (!S.me) return;
  var pg = PAGES[S.tab];
  $("pagehead").hidden = !pg;
  if (pg) $("page-title").textContent = pg.icon + " " + pg.label;
  $("banner").hidden = S.tab === "admin";
  var v = $("view");
  var f = { home: viewHome, profile: viewProfile, docs: viewDocs, vehicles: viewVehicles, bag: viewBag, rigs: viewRigs, admin: viewAdmin }[S.tab] || viewHome;
  // keep focus/typing safe: don't redraw a settings form someone is typing in
  if ((S.tab === "profile" || (S.tab === "admin" && (ADMIN_SETTINGS_TABS.indexOf(S.adminTab) >= 0 || S.adminTab === "remind" || S.adminTab === "reports"))) && v.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ renderBell(); return; }
  v.innerHTML = f();

// Save one paper picked in the vehicle form as its own document (same record as the upload form makes)

    fields: (function(){ var o = {}; docFields(t).forEach(function(d){ if (F[d[0]]) o[d[0]] = F[d[0]]; }); return o; })(),
    scanned: !!D.scanned, status: "pending", reviewNote: "",   // 1.29: approved in ⚙ Admin ▸ Review, also when an admin uploads
    onPolicy: t.id === "ins" && D.onPolicy != null ? D.onPolicy : null, policyNames: t.id === "ins" ? (D.policyNames || []) : [],
    updatedAt: Date.now(), updatedBy: S.me.unit || "", updatedByUid: S.me.uid

}

async function saveVehicle(id){
  function v(k){ return ($(k) ? $(k).value : "").trim(); }

    make: v("vf-make"), model: v("vf-model"), year: v("vf-year"), fuel: v("vf-fuel"), regState: v("vf-state"), color: v("vf-color"), regName: v("vf-regname") };
  var bad = [];
  if (!d.slot) bad.push("Pick Vehicle 1 or Vehicle 2");
  if (!d.plate) bad.push("Enter the license plate");
  if (!d.make || !d.model) bad.push("Enter the make and model");
  if (!/^(19|20)\d\d$/.test(d.year) || +d.year > new Date().getFullYear() + 1) bad.push("Year must be 4 digits, like 2022");
  if (d.vin && !/^[A-HJ-NPR-Z0-9]{17}$/.test(d.vin)) bad.push("VIN must be 17 letters/numbers (no I, O or Q)");
  if (!d.regState) bad.push("Pick the registration state");
  var replacing = !id && $("vf-repl") && $("vf-repl").value === "yes";
  var replId = replacing && $("vf-repl-which") ? $("vf-repl-which").value : "";
  if (replacing && !replId) bad.push("There's no vehicle to replace — answer No to \"Replacing Vehicle?\"");
  var other = S.myVehicles.filter(function(x){ return x.id !== id && x.id !== replId && x.slot === d.slot; })[0];
  if (other) bad.push("Vehicle " + d.slot + " is already your " + vTitle(other) + ". Pick the other number, or answer Yes to \"Replacing Vehicle?\"");
  if (!id && !replacing && S.myVehicles.length >= 2) bad.push("You already have two vehicles. Answer Yes to \"Replacing Vehicle?\"");
  var papers = !id && S.vf ? Object.keys(S.vf.docs).filter(function(tid){ return S.vf.docs[tid] && S.vf.docs[tid].file && typeById(tid); }) : [];
  papers.forEach(function(tid){ var t = typeById(tid), ex = $("vfd-" + tid + "-expires"); if (t.expires && !(ex && ex.value)) bad.push("Enter the expiration date on the " + t.name); });
  if (bad.length){ toast(bad.join(". ") + ".", 7000); return; }
  d.name = [d.year, d.make, d.model].join(" ");

  try {
    if (id) await db.collection("trk_myVehicles").doc(id).update(d);
    else {
      var batch = db.batch(), ref = db.collection("trk_myVehicles").doc();
      batch.set(ref, Object.assign({ uid: S.me.uid, unit: S.me.unit || "", createdAt: Date.now(), replaces: replId || null }, d));
      if (replId) batch.update(db.collection("trk_myVehicles").doc(replId), { replacedAt: Date.now(), replacedBy: ref.id });
      await batch.commit();
      var failed = [];
      for (var i = 0; i < papers.length; i++){
        $("vf-save").textContent = "Uploading " + typeById(papers[i]).name + "…";
        try { await vfStoreDoc(ref.id, [d.year, d.make, d.model].filter(Boolean).join(" "), papers[i]); }
        catch (e){ failed.push(typeById(papers[i]).name + " (" + e.message + ")"); }
      }
      var missing = docTypes("vehicle").filter(function(t){ return papers.indexOf(t.id) < 0; }).map(function(t){ return t.name.toLowerCase(); });
      closeModal();
      if (failed.length) toast("⚠ Vehicle saved, but these didn't upload: " + failed.join(", ") + ". Add them from My Vehicles.", 9000);
      else toast("✓ Vehicle saved" + (papers.length ? " with " + papers.length + " document" + (papers.length === 1 ? "" : "s") + (S.isAdmin ? " — approve them in ⚙ Admin ▸ Review" : " — an admin will review them") : "") + (missing.length ? ". Upload the " + missing.join(" and ") + " from My Vehicles." : ""), 7000);
      return;
    }
    closeModal(); toast("✓ Saved");
  } catch (e){ $("vf-save").disabled = false; toast("⚠ Not saved: " + e.message, 6000); }
}

// 1.18: documents whose expiration is a fixed time after the issue date (owner: CEVO = 3 years). The expiration date
// fills in by itself from the issue date (typed or scanned); the member can still change it by hand.
var AUTO_EXPIRE_YEARS = { cevo: 3 };
function addYears(ymd, n){
  var p = String(ymd || "").split("-"); if (p.length !== 3) return "";
  var y = +p[0] + n, m = +p[1], d = +p[2], last = new Date(y, m, 0).getDate();   // Feb 29 → Feb 28
  return y + "-" + pad(m) + "-" + pad(Math.min(d, last));
}
function upAutoExp(px, tid){
  px = px || "upf-";
  var t = tid ? typeById(tid) : upType(), yrs = t && AUTO_EXPIRE_YEARS[t.id], iss = $(px + "issued"), ex = $(px + "expires");
  if (!yrs || !iss || !ex || ex.dataset.typed || !/^\d{4}-\d{2}-\d{2}$/.test(iss.value)) return;
  ex.value = addYears(iss.value, yrs);
}
function upFieldsHtml(t, rec, px){

  if (t.expires) h += f("expires", "Expiration Date", rec && rec.expires, "date").replace('</div>', yrs ? '<div class="muted" style="margin-top:4px">Set automatically: ' + yrs + ' years from the issue date.</div></div>' : '</div>');
  h += f("number", "Document Number", rec && rec.number) + f("issued", "Issue Date", rec && rec.issued, "date");
  docFields(t).forEach(function(d){ h += f(d[0], d[1], x[d[0]], d[2]); });

// 1.20: PDF preview — a picture of page 1, drawn in the page with pdf.js (loaded only when a PDF is picked)
var PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
function loadPdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (loadPdfJs._p) return loadPdfJs._p;
  loadPdfJs._p = new Promise(function(res, rej){
    var sc = document.createElement("script"); sc.src = PDFJS_URL;
    sc.onload = function(){
      if (!window.pdfjsLib){ loadPdfJs._p = null; return rej(new Error("PDF viewer didn't load")); }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_URL.replace("pdf.min.js", "pdf.worker.min.js");
      res(window.pdfjsLib);
    };
    sc.onerror = function(){ loadPdfJs._p = null; rej(new Error("PDF viewer didn't load")); };
    document.head.appendChild(sc);
  });
  return loadPdfJs._p;
}
async function pdfFirstPage(file, maxW){
  var lib = await loadPdfJs();
  var doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  try {
    var page = await doc.getPage(1), v = page.getViewport({ scale: 1 });
    var vp = page.getViewport({ scale: Math.min(3, (maxW || 1000) / v.width) });
    var c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: g, viewport: vp }).promise;
    return { canvas: c, pages: doc.numPages };
  } finally { doc.destroy(); }
}
async function upPdfPreview(f){
  var prev = $("up-prev");
  try {
    var r = await pdfFirstPage(f, 1000);
    if (!S.upload || S.upload.file !== f) return;   // a different file was picked meanwhile
    var bl = await new Promise(function(res){ r.canvas.toBlob(res, "image/jpeg", 0.85); });
    prev.innerHTML = '<div style="text-align:center;width:100%"><img id="up-pdf-img" alt="Page 1 of the PDF" src="' + URL.createObjectURL(bl) + '" style="border:1px solid var(--line)">'
      + '<div class="muted" style="margin-top:6px">📄 ' + esc(f.name) + ' · page 1' + (r.pages > 1 ? ' of ' + r.pages : '') + '</div></div>';
  } catch (e){
    if (S.upload && S.upload.file === f) prev.innerHTML = '<span class="muted">📄 ' + esc(f.name) + ' — no preview for this PDF' + (/password/i.test(e && e.message) ? ' (it has a password)' : '') + '</span>';
  }
}
function upIsPdf(){ var f = S.upload && S.upload.file; return !!f && (/pdf/i.test(f.type) || /\.pdf$/i.test(f.name)); }

// ✨ Send the photo to the docScan server function (Gemini — the same key and models as Protocol Search).
// It fills only boxes the member hasn't typed in, and turns the photo upright if it's sideways.
async function upScan(){
  var U = S.upload, t = upType(), box = $("up-scan"), msg = $("up-scan-msg");
  if (!U.file || !box) return;
  box.hidden = false;
  if (!t){ if (upIsPdf()) upPdfReady(); else msg.textContent = "✨ Pick the document above and the details will be read from the photo."; return; }
  var my = (U.scanN = (U.scanN || 0) + 1);
  msg.textContent = "✨ Reading the " + t.name + "…"; $("up-scan-btn").disabled = true; $("up-scan-btn").textContent = "✨ Scan again";
  try {
    var isPdf = /pdf/i.test(U.file.type) || /\.pdf$/i.test(U.file.name);
    var sentRot = U.rot || 0;
    var blob = isPdf ? U.file : await shrinkForScan(U.file, sentRot);
    var data = await new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(String(r.result).split(",")[1]); }; r.onerror = rej; r.readAsDataURL(blob); });
    var want = [["number", "Document / license / certificate / policy number"], ["issued", "Issue date"]].concat(t.expires ? [["expires", "Expiration date"]] : []).concat(docFields(t));
    if (t.id === "ins") want.push(POLICY_NAMES_FIELD);
    var r = await callFn("docScan", { docType: t.name, fields: want.map(function(w){ return { key: w[0], label: scanLabel(w[0], w[1]), date: w[0] === "issued" || w[0] === "expires" || w[2] === "date" }; }), mime: isPdf ? "application/pdf" : "image/jpeg", data: data });
    if (my !== U.scanN) return;   // a newer scan started
    var got = (r && r.fields) || {}, filled = 0;
    Object.keys(got).forEach(function(k){ var el = $("upf-" + k), v = got[k]; if (!el || !v || el.dataset.typed) return; el.value = v; el.classList.add("scanned"); filled++; });
    upAutoExp();
    var turn = r && r.rotate ? ((r.rotate % 360) + 360) % 360 : 0;
    // 1.19: auto-crop — the scanner also says where the document's edges are in the photo (0–1000 of the photo as sent)
    var bx = !isPdf && r && Array.isArray(r.box) && r.box.length === 4 ? r.box.map(Number) : null;
    var cropped = !!(bx && bx[0] >= 0 && bx[1] >= 0 && bx[2] <= 1000 && bx[3] <= 1000 && bx[2] > bx[0] && bx[3] > bx[1]
      && (bx[2] - bx[0]) * (bx[3] - bx[1]) >= 100000 && (bx[2] - bx[0]) * (bx[3] - bx[1]) <= 920000);
    if (!isPdf){ U.crop = cropped ? { box: bx, rot: sentRot } : null; U.cropOff = false; }
    if (turn && !isPdf) U.rot = (sentRot + turn) % 360;
    if (!isPdf) upPreview();
    var notType = r && r.matches === false, polOwner = U.pre ? U.pre.ctx.owner : S.me.uid, polWarn = "";
    U.policyNames = null; U.onPolicy = null;
    if (t.id === "ins" && polOwner !== "org"){
      U.policyNames = splitNames(got.names); U.onPolicy = memberOnPolicy(polOwner, U.policyNames);
      if (U.onPolicy === false) polWarn = "⚠ " + (polOwner === S.me.uid ? "Your name isn't" : "This member's name isn't") + " on this insurance card" + (U.policyNames.length ? " (it lists " + esc(U.policyNames.join(", ")) + ")" : "") + ". You can still save — an admin will check it. ";
    }
    msg.innerHTML = (notType ? "⚠ This doesn't look like a " + esc(t.name) + ". " : "") + polWarn + (filled ? "✨ Filled in " + filled + " box" + (filled === 1 ? "" : "es") + " from the " + (isPdf ? "PDF" : "photo") + " — please check them." : "✨ Couldn't read any details — please type them in.")
      + (turn ? " Turned the photo upright." : "") + (cropped ? " Cropped to the document." : "");
  } catch (e){
    if (my !== U.scanN) return;
    msg.textContent = /404|Failed to fetch|not.?found/i.test(e.message) ? "✨ Scanning isn't set up on the server yet — type the details in." : "✨ Couldn't scan (" + e.message + ") — type the details in.";
  }
  $("up-scan-btn").disabled = false;
}
async function shrinkForScan(file, rot){
  var f = await shrinkImage(file, rot);
  try {   // smaller copy for reading: 1600 px is plenty for text
    var bmp = await createImageBitmap(f), sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (sc >= 1 && f.type === "image/jpeg") return f;
    var c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(function(res){ c.toBlob(res, "image/jpeg", 0.85); });
  } catch (e){ return f; }
}
function upRotate(d){
  S.upload.rot = ((S.upload.rot || 0) + d + 360) % 360;
  clearTimeout(S.upload.rotT); S.upload.rotT = setTimeout(function(){ if (S.upload && S.upload.file) upScan(); }, 900);

// 1.19: draw the photo the way it will be saved — turned and (if the scanner found the edges) cropped
function trkRotCanvas(src, deg){
  var w = src.width, h = src.height, side = deg === 90 || deg === 270;
  var c = document.createElement("canvas"); c.width = side ? h : w; c.height = side ? w : h;
  var g = c.getContext("2d"); g.translate(c.width / 2, c.height / 2); g.rotate(deg * Math.PI / 180); g.drawImage(src, -w / 2, -h / 2, w, h);

async function trkProcess(file, rot, crop, max){
  var bmp = await createImageBitmap(file), sc = Math.min(1, (max || 2000) / Math.max(bmp.width, bmp.height));
  var base = document.createElement("canvas"); base.width = Math.round(bmp.width * sc); base.height = Math.round(bmp.height * sc);
  base.getContext("2d").drawImage(bmp, 0, 0, base.width, base.height);
  rot = rot || 0;
  if (!crop) return trkRotCanvas(base, rot);
  var a = trkRotCanvas(base, crop.rot), b = crop.box, m = 12;   // keep a thin margin (1.2%) so no edge is cut off
  var x0 = Math.max(0, Math.round((b[1] - m) / 1000 * a.width)), y0 = Math.max(0, Math.round((b[0] - m) / 1000 * a.height));
  var x1 = Math.min(a.width, Math.round((b[3] + m) / 1000 * a.width)), y1 = Math.min(a.height, Math.round((b[2] + m) / 1000 * a.height));
  var c = document.createElement("canvas"); c.width = Math.max(1, x1 - x0); c.height = Math.max(1, y1 - y0);
  c.getContext("2d").drawImage(a, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  return trkRotCanvas(c, ((rot - crop.rot) % 360 + 360) % 360);
}

function ck(k, v){

}
function ckSection(si){

}

function ckQ(k, v){

function ckCount(){

    (s.items || []).forEach(function(it, ii){ total++; var a = C.ans[si + ":" + ii]; if (a) done++; if (a === "bad") bad++; });
    (s.questions || []).forEach(function(q, qi){ total++; var a = C.qa[si + ":" + qi]; if (a) done++; if (a === "no") bad++; });
  });
  $("ck-count").textContent = done + " of " + total + " checked" + (bad ? " · " + bad + " problem" + (bad === 1 ? "" : "s") : "");

function fmtPhone(v){

    E.data = clone(key === "rigChecklist" ? DEFAULT_RIG_CHECKLIST : (function(){ var q = S.settings.bagQuestions; S.settings.bagQuestions = null; var x = defaultBagChecklist(); S.settings.bagQuestions = q; return x; })()); }
  E.dirty = true; render();

function cedClean(key){

    var name = String(sec.name || "").trim();
    var items = (sec.items || []).map(function(it){ return { n: String(it.n || "").trim(), par: String(it.par || "").trim() }; }).filter(function(it){ return it.n; });
    var qs = (sec.questions || []).map(function(q){ return String(q || "").trim(); }).filter(Boolean);
    if (!name && !items.length && !qs.length) return;
    if (!name) bad.push("Section " + (i + 1) + " needs a name");

  });

}
